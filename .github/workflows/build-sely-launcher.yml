name: Build Sely Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Launcher
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Sely Launcher
        run: |
          mkdir -p project
          unzip -o SelyLauncher.zip -d project

      - name: Enable AndroidX
        working-directory: project/SelyLauncher
        run: |
          echo "Creating gradle.properties..."

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "gradle.properties:"
          cat gradle.properties

      - name: Check project
        working-directory: project/SelyLauncher
        run: |
          echo "Project:"
          pwd

          echo "Files:"
          find . -maxdepth 2 -type f | sort

          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Prepare Gradle
        working-directory: project/SelyLauncher
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not found."
            echo "Downloading Gradle 8.7..."

            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip

            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7

            chmod +x gradlew
          fi

      - name: Build Sely Launcher Debug APK
        working-directory: project/SelyLauncher
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "Searching for APK..."

          find project -name "*.apk" -type f -print

          test -f project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

          ls -lh project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-Launcher-APK
          path: project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
