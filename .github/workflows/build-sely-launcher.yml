name: Build Sely Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Launcher
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Sely Launcher
        run: |
          echo "Repository contents:"
          ls -lah

          echo "Extracting SelyLauncher.zip..."

          unzip -o SelyLauncher.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort

      - name: Locate Android project
        run: |
          echo "Searching for Gradle project..."

          find project -name settings.gradle.kts -o \
                       -name settings.gradle -o \
                       -name build.gradle.kts -o \
                       -name build.gradle

      - name: Prepare Gradle
        working-directory: project/SelyLauncher
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper not found."
            echo "Downloading Gradle 8.7..."

            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

            unzip -q gradle-8.7-bin.zip

            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7

            chmod +x gradlew
          fi

      - name: Build Sely Launcher Debug APK
        working-directory: project/SelyLauncher
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "Checking generated APK..."

          find project -name "*.apk" -type f -print

          test -f project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

          ls -lh project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-Launcher-APK
          path: project/SelyLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
