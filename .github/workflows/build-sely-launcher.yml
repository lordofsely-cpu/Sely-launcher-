name: Build Sely Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Launcher
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Check Sely Launcher project
        run: |
          echo "Project structure:"
          find . -maxdepth 3 -type f | sort

      - name: Make Gradle executable
        working-directory: SelyLauncher
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Prepare Gradle
        working-directory: SelyLauncher
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found."
            echo "Downloading Gradle 8.7..."

            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip

            unzip -q gradle-8.7-bin.zip

            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew

      - name: Build Sely Launcher Debug APK
        working-directory: SelyLauncher
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          echo "Checking APK..."

          if [ ! -f "SelyLauncher/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          ls -lh SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-Launcher-APK
          path: SelyLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
