name: Build Sely Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Sely Launcher
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Check project
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Make Gradle executable
        working-directory: SelyLauncher
        run: chmod +x gradlew 2>/dev/null || true

      - name: Generate Gradle wrapper if missing
        working-directory: SelyLauncher
        run: |
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.7 temporarily..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi

      - name: Build Debug APK
        working-directory: SelyLauncher
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh SelyLauncher/app/build/outputs/apk/debug/
          test -f SelyLauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Sely Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Sely-Launcher-Debug-APK
          path: SelyLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
